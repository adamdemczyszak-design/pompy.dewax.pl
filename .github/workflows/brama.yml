name: Wdrozenie bramy dewax.pl

on:
  push:
    branches: [main]
    paths: ['.github/brama-znacznik']

jobs:
  brama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Pobierz htaccess i odtworz oryginal
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
          KAT: ${{ vars.KATALOG_DEWAX || '/' }}
        run: |
          set -eu
          echo "katalog docelowy: $KAT"
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 25
          get ${KAT%/}/.htaccess -o htaccess-zserwera.txt
          bye
          LFTP
          echo "--- .htaccess pobrany z serwera ---"
          cat htaccess-zserwera.txt
          # Zdejmij blok bramy z poprzednich wdrozen, zeby kopia zapasowa byla ZAWSZE oryginalem.
          if grep -q "^# brama DEWAX" htaccess-zserwera.txt; then
            echo ">>> plik zawiera juz blok bramy — usuwam go przed zrobieniem kopii"
            sed -e '/^# brama DEWAX START/,/^# brama DEWAX END/d' -e '/^# brama DEWAX: strona wyboru dzialu/d' htaccess-zserwera.txt > bez-bloku.txt
            awk 'BEGIN{u=0} { if (u==0 && $0=="DirectoryIndex index.html index.php") { u=1; next } print }' bez-bloku.txt > htaccess-oryginal.txt
          else
            cp htaccess-zserwera.txt htaccess-oryginal.txt
          fi
          # skasuj puste linie z poczatku pliku
          sed -i '/./,$!d' htaccess-oryginal.txt
          grep -q "RewriteEngine On" htaccess-oryginal.txt || { echo "::error::W odtworzonym oryginale nie ma regul WordPressa — przerywam, nic nie wgrywam"; exit 1; }
          echo "--- oryginal bez bramy (to idzie do kopii zapasowej) ---"
          cat htaccess-oryginal.txt

      - name: Odloz oryginalna kopie htaccess na 90 dni
        uses: actions/upload-artifact@v4
        with:
          name: htaccess-oryginal-dewax-pl-${{ github.run_number }}
          path: htaccess-oryginal.txt
          retention-days: 90

      - name: Wgraj brame
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
          KAT: ${{ vars.KATALOG_DEWAX || '/' }}
        run: |
          set -eu
          {
            echo "# brama DEWAX START - usun wszystko do linii END, by wrocic do samej strony farb"
            echo "DirectoryIndex index.html index.php"
            echo "<IfModule mod_rewrite.c>"
            echo "RewriteEngine On"
            echo "RewriteBase /"
            echo "RewriteCond %{QUERY_STRING} (^|&)dzial=paint(&|\$)"
            echo "RewriteRule ^\$ index.php [L]"
            echo "</IfModule>"
            echo "# brama DEWAX END"
            echo
            cat htaccess-oryginal.txt
          } > htaccess-nowy.txt
          echo "--- nowy .htaccess ---"
          head -12 htaccess-nowy.txt
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set net:timeout 25
          put brama/index.html -o ${KAT%/}/index.html
          put brama/pompy.webp -o ${KAT%/}/pompy.webp
          put brama/granit.webp -o ${KAT%/}/granit.webp
          put brama/farba.webp -o ${KAT%/}/farba.webp
          put brama/logo-biale-kropki.png -o ${KAT%/}/logo-biale-kropki.png
          put htaccess-nowy.txt -o ${KAT%/}/.htaccess
          chmod 644 ${KAT%/}/index.html ${KAT%/}/.htaccess
          cls -la ${KAT%/}/index.html ${KAT%/}/.htaccess
          bye
          LFTP

      - name: Testy
        run: |
          set -u
          sleep 8
          ZLE=0
          spr() { echo "$1: $2 (oczekiwane $3)"; [ "$2" = "$3" ] || ZLE=$((ZLE+1)); }
          curl -s -L --max-time 30 https://dewax.pl/ -o glowna.html
          if grep -q "ENGINEERING" glowna.html && grep -q "PAINT" glowna.html; then
            echo "dewax.pl: BRAMA WIDOCZNA"
          else
            echo "::error::dewax.pl: brama NIEwidoczna"
            grep -o -i '<title>[^<]*</title>' glowna.html | head -1
            ZLE=$((ZLE+1))
          fi
          curl -s -L --max-time 30 "https://dewax.pl/?dzial=paint" -o farby.html
          if grep -qi "multilan" farby.html; then
            echo "DEWAX PAINT prowadzi na strone farb: OK"
            grep -o -i '<title>[^<]*</title>' farby.html | head -1
          else
            echo "::error::DEWAX PAINT nie prowadzi na strone farb"
            grep -o -i '<title>[^<]*</title>' farby.html | head -1
            ZLE=$((ZLE+1))
          fi
          spr "podstrona /kontakt/" "$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 'https://dewax.pl/kontakt/')" 200
          spr "podstrona /dotacje/" "$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 'https://dewax.pl/dotacje/')" 200
          spr "grafika pompy.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/pompy.webp)" 200
          spr "grafika granit.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/granit.webp)" 200
          spr "grafika farba.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/farba.webp)" 200
          spr "logo" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/logo-biale-kropki.png)" 200
          spr "pompy.dewax.pl dziala dalej" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://pompy.dewax.pl/)" 200
          spr "thermokrafft.pl dziala dalej" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://thermokrafft.pl/)" 200
          [ "$ZLE" -eq 0 ] && echo "WSZYSTKO OK" || { echo "BLEDY: $ZLE"; exit 1; }
