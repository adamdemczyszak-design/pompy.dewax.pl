name: Wdrozenie bramy dewax.pl

on:
  push:
    branches: [main]
    paths: ['.github/brama-znacznik']

jobs:
  brama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Kopia glownego htaccess
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
          KAT: ${{ vars.KATALOG_DEWAX || '/' }}
        run: |
          set -eu
          echo "katalog docelowy: $KAT"
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 25
          get ${KAT%/}/.htaccess -o htaccess-glowny.txt
          bye
          LFTP
          echo "--- obecny /.htaccess ---"
          cat htaccess-glowny.txt
          grep -qi "DirectoryIndex" htaccess-glowny.txt && echo "UWAGA: juz ma DirectoryIndex" || echo "brak DirectoryIndex — dopisze"

      - name: Odloz kopie htaccess na 90 dni
        uses: actions/upload-artifact@v4
        with:
          name: htaccess-dewax-pl-${{ github.run_number }}
          path: htaccess-glowny.txt
          retention-days: 90

      - name: Wgraj brame
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
          KAT: ${{ vars.KATALOG_DEWAX || '/' }}
        run: |
          set -eu
          if ! grep -qi "DirectoryIndex" htaccess-glowny.txt; then
            { echo "# brama DEWAX: strona wyboru dzialu przed WordPressem (usun te 2 linie, by wrocic)"; \
              echo "DirectoryIndex index.html index.php"; echo; cat htaccess-glowny.txt; } > htaccess-nowy.txt
          else
            cp htaccess-glowny.txt htaccess-nowy.txt
          fi
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set net:timeout 25
          put brama/index.html -o ${KAT%/}/index.html
          put brama/pompy.webp -o ${KAT%/}/pompy.webp
          put brama/granit.webp -o ${KAT%/}/granit.webp
          put brama/farba.webp -o ${KAT%/}/farba.webp
          put brama/logo-biale-kropki.png -o ${KAT%/}/logo-biale-kropki.png
          put htaccess-nowy.txt -o ${KAT%/}/.htaccess
          chmod 644 ${KAT%/}/index.html ${KAT%/}/.htaccess
          cls -la ${KAT%/}/index.html ${KAT%/}/.htaccess
          bye
          LFTP

      - name: Diagnoza pochodzenia
        run: |
          set -u
          echo "=== bezposrednio z serwera (z pominieciem CDN) ==="
          curl -sk --resolve dewax.pl:443:85.128.139.207 -o /dev/null -w "origin /: %{http_code}\n" --max-time 25 https://dewax.pl/
          curl -sk --resolve dewax.pl:443:85.128.139.207 --max-time 25 https://dewax.pl/ -o origin.html || true
          grep -q "ENGINEERING" origin.html && echo "origin: BRAMA WIDOCZNA" || { echo "origin: brama NIEwidoczna, tytul:"; grep -o -i '<title>[^<]*</title>' origin.html | head -1; }
          curl -sk --resolve dewax.pl:443:85.128.139.207 -o /dev/null -w "origin /pompy.webp: %{http_code}\n" --max-time 25 https://dewax.pl/pompy.webp
          echo "=== przez CDN z pominieciem cache ==="
          curl -s -o /dev/null -w "cdn /pompy.webp?v=2: %{http_code}\n" --max-time 25 "https://dewax.pl/pompy.webp?v=2"
          curl -sI --max-time 25 https://dewax.pl/ | grep -i -E "cdn|cache|age" || true

      - name: Testy
        run: |
          set -u
          ZLE=0
          spr() { echo "$1: $2 (oczekiwane $3)"; [ "$2" = "$3" ] || ZLE=$((ZLE+1)); }
          curl -s -L --max-time 30 https://dewax.pl/ -o glowna.html
          if grep -q "ENGINEERING" glowna.html && grep -q "PAINT" glowna.html; then
            echo "dewax.pl: BRAMA WIDOCZNA"
          else
            echo "dewax.pl: brama NIEwidoczna — tytul:"; grep -o -i '<title>[^<]*</title>' glowna.html | head -1
            ZLE=$((ZLE+1))
          fi
          spr "strona farb pod /index.php" "$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 'https://dewax.pl/index.php')" 200
          curl -s -L --max-time 30 'https://dewax.pl/index.php' -o farby.html
          grep -o -i '<title>[^<]*</title>' farby.html | head -1
          spr "grafika pompy.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/pompy.webp)" 200
          spr "grafika granit.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/granit.webp)" 200
          spr "grafika farba.webp" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/farba.webp)" 200
          spr "logo" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://dewax.pl/logo-biale-kropki.png)" 200
          spr "pompy.dewax.pl dziala dalej" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://pompy.dewax.pl/)" 200
          [ "$ZLE" -eq 0 ] && echo "WSZYSTKO OK" || { echo "BLEDY: $ZLE"; exit 1; }
