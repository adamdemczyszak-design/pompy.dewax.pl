name: Test katalogu dewax.pl

on:
  push:
    branches: [main]
    paths: ['.github/test-znacznik']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Instaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Wgraj znacznik w dwa miejsca i sprawdz
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          set -eu
          Z="znacznik-$RANDOM$RANDOM.txt"
          echo "test $Z" > "$Z"
          echo "nazwa pliku: $Z"
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set net:timeout 25
          put $Z -o /$Z
          put $Z -o /pompy/webroot/$Z
          put $Z -o /thermokrafft/$Z
          chmod 644 /$Z /pompy/webroot/$Z /thermokrafft/$Z
          bye
          LFTP
          sleep 3
          echo "=== WYNIKI ==="
          echo "pompy.dewax.pl (katalog /pompy/webroot): $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://pompy.dewax.pl/$Z)"
          echo "thermokrafft.pl (katalog /thermokrafft): $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://thermokrafft.pl/$Z)"
          echo "dewax.pl        (katalog glowny /):      $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://dewax.pl/$Z)"
          echo "www.dewax.pl    (katalog glowny /):      $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://www.dewax.pl/$Z)"
          echo "=== sprzatanie ==="
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:timeout 25; rm -f /$Z; rm -f /pompy/webroot/$Z; rm -f /thermokrafft/$Z; bye"
          echo "znaczniki usuniete"
