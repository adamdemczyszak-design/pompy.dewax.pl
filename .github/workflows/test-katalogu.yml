name: Test katalogu dewax.pl

on:
  push:
    branches: [main]
    paths: ['.github/test-znacznik']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Instaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Porownaj pliki zywej strony z kontem FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          set -u
          echo "=== pobieram z zywej strony ==="
          curl -s --max-time 30 "https://dewax.pl/wp-content/et-cache/2/et-core-unified-2.min.css" -o zywy.css
          curl -s --max-time 30 "https://dewax.pl/readme.html" -o zywy-readme.html
          ls -la zywy.css zywy-readme.html
          echo "=== pobieram z konta FTP ==="
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<'LFTP'
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 25
          get /wp-content/et-cache/2/et-core-unified-2.min.css -o ftp.css
          get /readme.html -o ftp-readme.html
          cls -la /wp-content/et-cache/2/
          bye
          LFTP
          ls -la ftp.css ftp-readme.html 2>/dev/null || echo "brak plikow z FTP"
          echo "=== POROWNANIE ==="
          for p in "css" "readme.html"; do :; done
          if [ -f ftp.css ]; then
            echo "styl zywy : $(md5sum zywy.css | cut -c1-32)  $(wc -c < zywy.css) bajtow"
            echo "styl z FTP: $(md5sum ftp.css | cut -c1-32)  $(wc -c < ftp.css) bajtow"
            cmp -s zywy.css ftp.css && echo ">>> STYLE IDENTYCZNE — ta sama instalacja" || echo ">>> STYLE ROZNE — inna instalacja"
          fi
          if [ -f ftp-readme.html ]; then
            cmp -s zywy-readme.html ftp-readme.html && echo ">>> readme.html IDENTYCZNY" || echo ">>> readme.html ROZNY"
          fi
