name: Diagnoza zywej strony

on:
  push:
    branches: [main]
    paths: ['.github/diagnoza-znacznik']

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ktora wersja kalkulatora jest na zywo
        run: |
          set -u
          for i in 1 2 3; do
            curl -s --max-time 30 -H "Cache-Control: no-cache" "https://pompy.dewax.pl/?proba=$i" -o zywa$i.html
            echo "proba $i:"
            grep -c "kk.getBoundingClientRect" zywa$i.html && echo "  NOWY kod przewijania" || true
            grep -c "scrollTo({top:0" zywa$i.html && echo "  STARY kod - skok na gore" || true
          done
          echo "=== bez parametru (tak jak przegladarka) ==="
          curl -s --max-time 30 https://pompy.dewax.pl/ -o zywa0.html
          grep -c "kk.getBoundingClientRect" zywa0.html && echo "NOWY" || true
          grep -c "scrollTo({top:0" zywa0.html && echo "STARY" || true
          curl -sI --max-time 30 https://pompy.dewax.pl/ | grep -i -E "cdn|cache|age|pagespeed"
