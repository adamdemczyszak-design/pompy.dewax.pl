name: Diagnoza zywej strony

on:
  push:
    branches: [main]
    paths: ['.github/diagnoza-znacznik']

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz grafiki ze strony farb dewax.pl
        run: |
          set -u
          mkdir -p grafiki
          curl -s -L --max-time 30 https://dewax.pl/ -o strona.html
          echo "=== wszystkie obrazki na stronie ==="
          grep -o -E '(src|href|content)="[^"]*\.(jpe?g|png|webp)[^"]*"' strona.html | sed 's/^[a-z]*="//;s/"$//' | sort -u | tee lista.txt
          echo
          echo "=== takze z srcset i tla CSS ==="
          grep -o -E 'url\(([^)]*\.(jpe?g|png|webp))\)' strona.html | sed 's/url(//;s/)//;s/["'"'"']//g' | sort -u | tee -a lista.txt
          echo
          n=0
          while read -r u; do
            case "$u" in http*) adres="$u";; //*) adres="https:$u";; /*) adres="https://dewax.pl$u";; *) adres="https://dewax.pl/$u";; esac
            plik="grafiki/$(printf '%02d' $n)-$(basename "${adres%%\?*}")"
            curl -s -L --max-time 30 -o "$plik" "$adres" && n=$((n+1))
            [ $n -ge 14 ] && break
          done < <(sort -u lista.txt)
          echo "pobrano: $n"
          ls -la grafiki/
          # tylko sensowne rozmiary
          find grafiki -type f -size -12k -delete
          ls -la grafiki/
      - name: Odloz grafiki
        uses: actions/upload-artifact@v4
        with:
          name: grafiki-farb
          path: grafiki
          retention-days: 7
          if-no-files-found: warn
