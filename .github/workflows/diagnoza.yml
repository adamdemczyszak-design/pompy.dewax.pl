name: Diagnoza zywej strony

on:
  push:
    branches: [main]
    paths: ['.github/diagnoza-znacznik']

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    steps:
      - name: Co domena widzi z katalogu FTP
        run: |
          set -u
          k() { curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$1"; }
          echo "readme.html (stary plik 644 w katalogu FTP): $(k https://dewax.pl/readme.html)"
          echo "index_default.html (stary 755):             $(k https://dewax.pl/index_default.html)"
          echo "license.txt (stary 600):                    $(k https://dewax.pl/license.txt)"
          echo "pompy.webp (nasz, wgrany 8:46):             $(k https://dewax.pl/pompy.webp)"
          echo "pompy.webp?swiezy=$RANDOM:                  $(k "https://dewax.pl/pompy.webp?swiezy=$RANDOM")"
          echo "index.html (nasza brama, wprost):           $(k https://dewax.pl/index.html)"
          echo "--- naglowki pompy.webp ---"
          curl -sI --max-time 25 https://dewax.pl/pompy.webp | head -12
          echo "--- naglowki index.html ---"
          curl -sI --max-time 25 https://dewax.pl/index.html | head -12
