name: Listuj katalogi FTP

on:
  push:
    branches: [main]
    paths: ['.github/listuj-znacznik']

jobs:
  listuj:
    runs-on: ubuntu-latest
    steps:
      - name: Instaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Reguly htaccess i zawartosc uploads
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          set -eu
          lftp --env-password -u "$FTP_LOGIN" "ftp://$FTP_HOST" <<'LFTP'
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 25
          get /.htaccess -o htac.txt
          cls -la /wp-content/uploads
          cls -la /wp-content/et-cache
          bye
          LFTP
          echo "=================== reguly z .htaccess ==================="
          cat htac.txt
