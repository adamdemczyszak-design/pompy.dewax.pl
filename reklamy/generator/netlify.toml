# Panel generatora kreacji: statyczne pliki z tego katalogu, bez kroku budowania.
# Projekt Netlify: dewax-generator (https://dewax-generator.netlify.app), zespół jak dewax-kreator.
[build]
  publish = "."
  command = ""

# Panel jest wewnętrzny: bez indeksowania. Wyniki mają być zawsze świeże.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/wyniki.json"
  [headers.values]
    Cache-Control = "no-cache"
